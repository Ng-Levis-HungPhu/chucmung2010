services:
  - type: web
    name: chuc-mung-2010-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: https://TEN-GITHUB-CUA-BAN.github.io
      - key: ADMIN_KEY
        generateValue: true
